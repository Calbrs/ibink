org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Kotlin incremental compiler workaround ──────────────────────────────────
# Disabled because the Kotlin daemon incremental cache (.tab files) cannot
# handle file locking correctly when the project path contains spaces.
# See: https://youtrack.jetbrains.com/issue/KT-57754
kotlin.incremental=false

# Run Gradle in-process (no separate daemon) to avoid stale daemon cache locks
org.gradle.daemon=false
